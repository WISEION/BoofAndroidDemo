name: Build Boof Mystic CV APK

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "boof_mystic_cv/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle/**"
      - ".github/workflows/boof_mystic_cv-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :boof_mystic_cv:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boof_mystic_cv-debug-apk
          path: boof_mystic_cv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
